<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site Monitor</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --text:#1b1b1b; --mid:#6b6b66; --line:#e3e2dd; --ok:#1a7f4b; --ko:#c0352b; --warn:#b7791f; --accent:#2a5bd7; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121314; --card:#1b1c1e; --text:#ecebe8; --mid:#9a9992; --line:#2c2d30; --ok:#4cc38a; --ko:#ef6b60; --warn:#e0b050; --accent:#7ea2ff; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:980px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--mid); font-size:13px; margin-bottom:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  .head { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
  h2 { font-size:17px; margin:0; }
  .badge { font-size:12px; font-weight:600; padding:2px 10px; border-radius:99px; color:#fff; }
  .badge.ok { background:var(--ok); } .badge.ko { background:var(--ko); }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; margin:14px 0; }
  .stat b { display:block; font-size:22px; } .stat span { color:var(--mid); font-size:12px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:6px 8px; border-top:1px solid var(--line); }
  th { color:var(--mid); font-weight:500; border-top:0; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .url { max-width:340px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ok-t { color:var(--ok); } .ko-t { color:var(--ko); } .warn-t { color:var(--warn); }
  svg { width:100%; height:110px; display:block; margin-top:6px; }
  .legend { color:var(--mid); font-size:12px; margin-top:4px; }
  .bar { display:flex; gap:2px; height:22px; margin-top:6px; }
  .bar i { flex:1; border-radius:2px; background:var(--ok); } .bar i.ko { background:var(--ko); } .bar i.na { background:var(--line); }
</style>
</head>
<body>
<main>
  <h1>Site Monitor</h1>
  <div class="sub" id="updated">Caricamento…</div>
  <div id="sites"></div>
</main>
<script>
const $ = (s) => document.querySelector(s);
const pct = (a, b) => (b ? ((a / b) * 100).toFixed(2) + '%' : '–');
const avg = (v) => (v.length ? Math.round(v.reduce((x, y) => x + y, 0) / v.length) : null);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

async function jsonl(path) {
  try {
    const r = await fetch(path + '?_=' + Date.now());
    if (!r.ok) return [];
    return (await r.text()).split('\n').filter(Boolean).map((l) => JSON.parse(l));
  } catch (e) { return []; }
}

function uptime(rows, hours) {
  const since = Date.now() - hours * 3600e3;
  const r = rows.filter((x) => Date.parse(x.t) >= since);
  return pct(r.filter((x) => x.ok).length, r.length);
}

function chart(rows) {
  const pts = rows.filter((x) => x.total != null);
  if (pts.length < 2) return '<div class="legend">Dati insufficienti</div>';
  const w = 900, h = 110, max = Math.max(...pts.map((p) => p.total), 1000);
  const t0 = Date.parse(pts[0].t), t1 = Date.parse(pts[pts.length - 1].t) || t0 + 1;
  const xy = (p) => [((Date.parse(p.t) - t0) / (t1 - t0 || 1)) * w, h - 6 - (p.total / max) * (h - 14)];
  const d = pts.map((p, i) => { const [x, y] = xy(p); return (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1); }).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Tempo di risposta ultime 24 ore">
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>
    <div class="legend">Tempo totale ultime 24 ore · massimo ${max} ms</div>`;
}

function bar(rows) {
  const days = [];
  for (let i = 13; i >= 0; i--) {
    const day = new Date(Date.now() - i * 864e5).toISOString().slice(0, 10);
    const r = rows.filter((x) => x.t.startsWith(day));
    const bad = r.filter((x) => !x.ok).length;
    days.push(`<i class="${r.length ? (bad ? 'ko' : '') : 'na'}" title="${day}: ${r.length ? bad + ' errori su ' + r.length : 'nessun dato'}"></i>`);
  }
  return `<div class="bar" aria-label="Ultimi 14 giorni">${days.join('')}</div><div class="legend">Ultimi 14 giorni</div>`;
}

function siteCard(name, rows, psi) {
  const last24 = rows.filter((x) => Date.parse(x.t) >= Date.now() - 864e5);
  const byUrl = {};
  rows.forEach((r) => (byUrl[r.url] = byUrl[r.url] || []).push(r));
  const urls = Object.keys(byUrl);
  const lastRows = urls.map((u) => byUrl[u][byUrl[u].length - 1]);
  const allOk = lastRows.every((r) => r.ok);
  const main = byUrl[urls[0]] || [];
  const p = psi.length ? psi[psi.length - 1] : null;

  const tableRows = urls.map((u) => {
    const r = byUrl[u], l = r[r.length - 1], day = r.filter((x) => Date.parse(x.t) >= Date.now() - 864e5);
    const t = avg(day.filter((x) => x.total != null).map((x) => x.total));
    return `<tr><td class="url" title="${esc(u)}">${esc(u.replace(/^https?:\/\/(www\.)?/, ''))}</td>
      <td class="${l.ok ? 'ok-t' : 'ko-t'}">${l.ok ? 'OK' : esc(l.err || l.status)} ${l.status || ''}</td>
      <td class="num">${l.ttfb ?? '–'}</td><td class="num">${t ?? '–'}</td><td class="num">${uptime(r, 24)}</td><td class="num">${uptime(r, 168)}</td></tr>`;
  }).join('');

  const psiHtml = p && !p.err ? `<div class="stats">
      <div class="stat"><b class="${p.score >= 90 ? 'ok-t' : p.score >= 50 ? 'warn-t' : 'ko-t'}">${p.score}</b><span>PageSpeed mobile</span></div>
      <div class="stat"><b>${(p.lcp / 1000).toFixed(1)} s</b><span>LCP</span></div>
      <div class="stat"><b>${p.tbt} ms</b><span>TBT</span></div>
      <div class="stat"><b>${p.cls}</b><span>CLS</span></div>
      ${p.ssl_days != null ? `<div class="stat"><b class="${p.ssl_days < 14 ? 'ko-t' : ''}">${p.ssl_days} gg</b><span>Scadenza SSL</span></div>` : ''}
    </div><div class="legend">Ultima analisi: ${new Date(p.t).toLocaleString('it-IT')}</div>`
    : '<div class="legend">Nessuna analisi PageSpeed disponibile.</div>';

  return `<section class="card">
    <div class="head"><h2>${esc(name)}</h2><span class="badge ${allOk ? 'ok' : 'ko'}">${allOk ? 'Online' : 'Problemi'}</span></div>
    <div class="stats">
      <div class="stat"><b>${uptime(rows, 24)}</b><span>Uptime 24 ore</span></div>
      <div class="stat"><b>${uptime(rows, 168)}</b><span>Uptime 7 giorni</span></div>
      <div class="stat"><b>${uptime(rows, 336)}</b><span>Uptime 14 giorni</span></div>
      <div class="stat"><b>${avg(last24.filter((x) => x.total != null).map((x) => x.total)) ?? '–'} ms</b><span>Tempo medio 24 ore</span></div>
    </div>
    ${bar(rows)}
    ${chart(main.filter((x) => Date.parse(x.t) >= Date.now() - 864e5))}
    <table style="margin-top:14px"><thead><tr><th>URL</th><th>Stato</th><th class="num">TTFB ms</th><th class="num">Medio ms</th><th class="num">24 h</th><th class="num">7 gg</th></tr></thead><tbody>${tableRows}</tbody></table>
    <div style="margin-top:14px">${psiHtml}</div>
  </section>`;
}

(async () => {
  const [checks, psi] = await Promise.all([jsonl('data/checks.jsonl'), jsonl('data/psi.jsonl')]);
  if (!checks.length) { $('#updated').textContent = 'Nessun dato ancora raccolto.'; return; }
  const sites = [...new Set(checks.map((r) => r.site))];
  $('#sites').innerHTML = sites.map((s) => siteCard(s, checks.filter((r) => r.site === s), psi.filter((r) => r.site === s))).join('');
  $('#updated').textContent = 'Ultimo controllo: ' + new Date(checks[checks.length - 1].t).toLocaleString('it-IT');
})();
</script>
</body>
</html>
