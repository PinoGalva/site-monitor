name: check
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: monitor-data
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python monitor.py check
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Salva i dati
        run: |
          git config user.name "site-monitor"
          git config user.email "site-monitor@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || (git commit -m "dati $(date -u +%FT%TZ)" && git pull --rebase -q && git push -q)
