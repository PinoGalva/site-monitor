name: daily
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: monitor-data
  cancel-in-progress: false
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python monitor.py daily
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
      - name: Salva i dati
        run: |
          git config user.name "site-monitor"
          git config user.email "site-monitor@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || (git commit -m "psi $(date -u +%F)" && git pull --rebase -q && git push -q)
